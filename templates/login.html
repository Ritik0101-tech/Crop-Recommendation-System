<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Crop AI</title>

    <link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/style.css') }}">

    <link rel="icon"
      href="/static/images/logo.png">
</head>

<script>

document.querySelector("form")
.addEventListener(

    "submit",

    function(e){

        const mobile =
        document.getElementById(
            "mobile"
        ).value


        const regex =
        /^[0-9]{10}$/


        if(!regex.test(mobile)){

            e.preventDefault()

            alert(
                "Mobile number must contain exactly 10 digits"
            )
        }
    }
)

</script>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo-box">

            <img
            src="{{ url_for('static',
            filename='images/logo.png') }}"
            class="logo"
            alt="logo">

            <h2 id="mainTitle">

                Smart Crop AI

            </h2>

        </div>

        <!-- LANGUAGE -->

        <select id="languageSelect"
                onchange="changeLanguage()">

            <option value="en">

                English

            </option>

            <option value="hi">

                हिन्दी

            </option>

        </select>

    </div>



    <!-- LOGIN BOX -->

    <div class="auth-container">

        <div class="auth-box">

            <h1 id="loginTitle">

                Login

            </h1>


            <p id="loginText">

                Login to access crop prediction system

            </p>


            <!-- FORM -->

            <form method="POST"
                  action="/login">

                <input type="text"

                    id="mobile"

                    name="mobile"

                    placeholder="Mobile Number"

                    maxlength="10"

                    pattern="[0-9]{10}"

                    title="Enter 10 digit mobile number"

                    required>



                <!-- PASSWORD -->

                <input type="password"
                       name="password"
                       id="passwordInput"
                       placeholder="Password"
                       required>



                <!-- LOGIN BUTTON -->

                <button type="submit"
                        id="loginBtn">

                    Login

                </button>

            </form>



            <!-- REGISTER -->

            <div class="bottom-link">

                <p id="registerText">

                    Don't have an account?

                </p>

                <a href="/register">

                    <button id="registerBtn">

                        Register

                    </button>

                </a>

            </div>



            <!-- BACK -->

            <a href="/">

                <button class="back-btn"
                        id="backBtn">

                    Back

                </button>

            </a>

        </div>

    </div>



    <!-- LANGUAGE SCRIPT -->

    <script>

        function changeLanguage(){

            const lang = document.getElementById(
                "languageSelect"
            ).value


            // HINDI

            if(lang === "hi"){

                document.getElementById(
                    "mainTitle"
                ).innerText =
                "🌱 स्मार्ट क्रॉप एआई"


                document.getElementById(
                    "loginTitle"
                ).innerText =
                "लॉगिन"


                document.getElementById(
                    "loginText"
                ).innerText =
                "फसल भविष्यवाणी प्रणाली तक पहुँचने के लिए लॉगिन करें"


                document.getElementById(
                    "mobileInput"
                ).placeholder =
                "मोबाइल नंबर"


                document.getElementById(
                    "passwordInput"
                ).placeholder =
                "पासवर्ड"


                document.getElementById(
                    "loginBtn"
                ).innerText =
                "लॉगिन"


                document.getElementById(
                    "registerText"
                ).innerText =
                "क्या आपका अकाउंट नहीं है?"


                document.getElementById(
                    "registerBtn"
                ).innerText =
                "रजिस्टर"


                document.getElementById(
                    "backBtn"
                ).innerText =
                "वापस"
            }


            // ENGLISH

            else{

                location.reload()
            }
        }

    </script>

</body>
</html>
